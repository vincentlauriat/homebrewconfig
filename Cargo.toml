[package]
name = "homebrewconfig"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "A TUI and CLI for configuring Homebrew environment variables"
license = "MIT"
readme = "README.md"
repository = "https://github.com/vincentlauriat/homebrewconfig"
homepage = "https://github.com/vincentlauriat/homebrewconfig"
keywords = ["homebrew", "cli", "tui", "macos", "configuration"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
